<!DOCTYPE html>
<!--
  ============================================================================
  FoundDirect STUDIO — her local lead-to-pitch workstation
  ----------------------------------------------------------------------------
  HOW TO USE: double-click this file → it opens in your browser. No install,
  no internet needed. Click "Import leads" and choose any of the CSV lead
  lists (e.g. khaoyai-highend-noweb-...csv). Everything you do (status, notes)
  is saved on THIS computer (localStorage). Export anytime to save progress.

  What it does:
   • Loads a leads CSV and shows a clean, filterable pipeline
   • For EACH business, auto-writes a tailored pitch (English + Thai) based on
     its real situation (no website / Facebook-only / bad site, hotel vs spa,
     review count, rating, premium tier)
   • A pre-outreach research checklist + notes per lead
   • Pipeline status tracking + a daily outreach target
   • One-tap: open Google Maps, call, copy the pitch
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FoundDirect Studio — Lead & Pitch Workstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--brand:#0f766e;--brand-2:#0e7490;--ink:#0b1220;--ink-soft:#334155;--muted:#64748b;--bg:#f6f8fa;--card:#fff;--line:#e2e8f0;--accent:#f59e0b;--ok:#10b981;--hot:#ef4444;--warm:#f59e0b;--cool:#94a3b8;--line-green:#06c755;--radius:14px;--shadow:0 6px 22px rgba(8,40,36,.08);--display:'Sora',system-ui,sans-serif;--body:'Inter',system-ui,"Noto Sans Thai",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);color:var(--ink-soft);background:var(--bg);line-height:1.55;height:100vh;overflow:hidden}
  h1,h2,h3,h4{font-family:var(--display);color:var(--ink);letter-spacing:-.01em}
  button{font-family:var(--body);cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;font-weight:700;font-size:.9rem;padding:9px 16px;border-radius:999px;transition:.12s}
  .btn:hover{filter:brightness(.97)}.btn-p{background:var(--accent);color:#1f2937}.btn-d{background:var(--ink);color:#fff}.btn-o{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-g{background:var(--line-green);color:#fff}.btn-t{background:var(--brand);color:#fff}
  /* layout */
  header{height:62px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px}
  .logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:1.15rem;color:#fff}
  .logo svg{flex:0 0 auto}
  .hstats{display:flex;gap:18px;font-size:.82rem;color:#cbd5e1}.hstats b{color:#fff;font-family:var(--display);font-size:1.05rem;display:block;line-height:1}
  .hactions{display:flex;gap:8px}
  main{display:grid;grid-template-columns:340px 1fr 420px;height:calc(100vh - 62px)}
  @media(max-width:1100px){main{grid-template-columns:300px 1fr}.detail{display:none}}
  .col{overflow-y:auto;height:100%}
  /* filters + list */
  .side{background:#fff;border-right:1px solid var(--line);padding:14px}
  .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.9rem;margin-bottom:10px}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{font-size:.76rem;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .leadrow{padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff;transition:.1s}
  .leadrow:hover{border-color:var(--brand)}.leadrow.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(15,118,110,.15)}
  .leadrow .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .leadrow .nm{font-weight:700;color:var(--ink);font-size:.92rem;line-height:1.2}
  .leadrow .meta{font-size:.76rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .tag{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .tag.hot{background:#fee2e2;color:#b91c1c}.tag.warm{background:#fef3c7;color:#92400e}.tag.prem{background:#ccfbf1;color:#0f766e}.tag.cool{background:#f1f5f9;color:#475569}
  .tag.none{background:#ede9fe;color:#6d28d9}.tag.social{background:#dbeafe;color:#1d4ed8}.tag.ota{background:#ffe4e6;color:#be123c}.tag.real{background:#f1f5f9;color:#475569}
  /* center */
  .center{padding:18px 22px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:40px}
  .drop{border:2px dashed var(--line);border-radius:18px;padding:46px;width:100%;max-width:460px;transition:.15s}
  .drop.over{border-color:var(--brand);background:var(--brand);background:rgba(15,118,110,.05)}
  .dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat b{font-family:var(--display);font-size:1.5rem;color:var(--ink);display:block}.stat span{font-size:.76rem;color:var(--muted)}
  .sech{font-family:var(--display);font-weight:700;color:var(--ink);margin:6px 0 10px;font-size:1rem}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .pcol{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:80px}
  .pcol h5{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .ptask{font-size:.78rem;background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:5px;cursor:pointer;border:1px solid transparent}
  .ptask:hover{border-color:var(--brand)}
  /* detail */
  .detail{background:#fff;border-left:1px solid var(--line);padding:18px}
  .dhead h2{font-size:1.25rem;line-height:1.15}
  .dmeta{font-size:.82rem;color:var(--muted);margin:6px 0 12px;display:flex;flex-wrap:wrap;gap:6px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .panel{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:13px}
  .panel h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--brand);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.78rem}
  .seg button{border:0;background:#fff;padding:4px 12px;font-weight:700;color:var(--muted)}.seg button.on{background:var(--brand);color:#fff}
  .pitch{white-space:pre-wrap;font-size:.86rem;background:var(--bg);border-radius:10px;padding:12px;color:var(--ink);max-height:280px;overflow:auto}
  .hook{font-size:.82rem;color:var(--ink);background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px;margin-bottom:9px}
  select,textarea{width:100%;font-family:var(--body);font-size:.86rem;border:1px solid var(--line);border-radius:8px;padding:8px}
  textarea{min-height:64px;resize:vertical}
  .check{display:flex;align-items:flex-start;gap:8px;font-size:.82rem;margin-bottom:6px}
  .check input{margin-top:3px}
  .askbox{font-size:.8rem;background:var(--bg);border-radius:8px;padding:8px;margin-bottom:6px;border:1px solid var(--line);color:var(--ink-soft)}
  .copybtn{font-size:.72rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--brand);font-weight:700}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  a.q{text-decoration:none}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="26" height="26" viewBox="0 0 48 48"><path d="M24 4C14 4 6 12 6 22c0 12 18 22 18 22s18-10 18-22C42 12 34 4 24 4z" fill="#2dd4bf"/><path d="M24 13l8 11h-6v8h-4v-8h-6z" fill="#0b1220"/></svg> FoundDirect <span style="color:#5eead4">Studio</span></div>
  <div class="hstats" id="hstats"></div>
  <div class="hactions">
    <label class="btn btn-p">⬆ Import leads<input type="file" id="file" accept=".csv" hidden></label>
    <button class="btn btn-o" id="export">⬇ Export</button>
  </div>
</header>
<main>
  <div class="col side">
    <input class="search" id="search" placeholder="Search name / area…">
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>
  <div class="col center" id="center">
    <div class="empty" id="empty">
      <div class="drop" id="drop">
        <div style="font-size:2.4rem">🗺️</div>
        <h2 style="margin:10px 0 6px">Import your leads</h2>
        <p>Click <b>Import leads</b> (top-right) or drop a CSV here.<br>Try <code>khaoyai-highend-noweb-2026-06-03.csv</code>.</p>
        <p style="margin-top:14px;font-size:.82rem;color:#94a3b8">Everything stays on this computer. Nothing is uploaded.</p>
      </div>
    </div>
    <div id="dash" style="display:none"></div>
  </div>
  <div class="col detail" id="detail"><div class="empty"><p>Select a lead to see its tailored pitch.</p></div></div>
</main>

<script>
const STORE="founddirect_studio_v1";
let LEADS=[], SEL=null, FILT={tier:"",site:"",status:"",type:"",phone:false}, Q="", LANG={};
const saved=JSON.parse(localStorage.getItem(STORE)||"{}");   // {leadId:{status,notes,checks,contactedDate}}

// ---------- CSV parse ----------
function parseCSV(t){
  const rows=[];let i=0,f="",row=[],q=false;
  while(i<t.length){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else{ if(c=='"')q=true; else if(c==',' ){row.push(f);f=""} else if(c=='\n'){row.push(f);rows.push(row);row=[];f=""} else if(c=='\r'){} else f+=c }
    i++}
  if(f.length||row.length){row.push(f);rows.push(row)}
  const hdr=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.length>1).map(r=>{const o={};hdr.forEach((h,j)=>o[h]=(r[j]||"").trim());return o});
}
const pick=(o,...keys)=>{for(const k of keys){if(o[k]!==undefined&&o[k]!=="")return o[k]}return""};
function norm(o){
  const website=pick(o,"website");
  return {
    name:pick(o,"name","title"), phone:pick(o,"phone"), website,
    category:pick(o,"category","categoryname"), area:pick(o,"area","neighborhood","address"),
    rating:pick(o,"rating","totalscore"), reviews:+pick(o,"reviews","reviewscount")||0,
    photos:+pick(o,"photos","imagescount")||0, price:pick(o,"price"),
    premium:(pick(o,"premium")||"").toUpperCase()==="Y", group:pick(o,"group"),
    tier:pick(o,"tier","priority"), maps:pick(o,"maps_url","url"), site_type:pick(o,"site_type")
  };
}
function leadId(l){return (l.name+"|"+l.maps).slice(0,120)}

// ---------- situation + pitch ----------
function siteState(l){
  let w=(l.website||"").toLowerCase(), st=(l.site_type||"").toLowerCase();
  if(st)return st==="none"?"none":st;
  if(!w)return "none";
  if(/facebook|instagram|line\.me|linktr|fb\.me|fb\.com|\.business\.site|wixsite|tiktok/.test(w))return "social";
  if(/agoda|booking\.com|airbnb|hostelworld|tripadvisor|expedia|traveloka|bluepillow|freecancellation|bookingth/.test(w))return "ota";
  return "real";
}
function isSpa(l){return /spa|massage|wellness|onsen/.test((l.category+" "+l.group).toLowerCase())}
function isPrem(l){return l.premium || /฿฿฿|\$\$\$/.test(l.price) || (l.tier||"").toUpperCase().includes("HOT")}
function genPitch(l){
  const s=siteState(l), spa=isSpa(l), prem=isPrem(l);
  const rv=l.reviews, rt=l.rating||"—", nm=l.name||"your place", area=l.area||"";
  // the specific true observation (hook)
  let hookEN,hookTH;
  if(s==="none"){ hookEN=`${rv}+ Google reviews (⭐${rt}) but no website — guests can only book via the OTAs, so you're paying 15–25% commission.`;
    hookTH=`มีรีวิว Google กว่า ${rv} (⭐${rt}) แต่ยังไม่มีเว็บไซต์ ลูกค้าจองได้แค่ผ่าน OTA จึงเสียค่าคอม 15–25%`; }
  else if(s==="social"){ hookEN=`Your "website" is just a Facebook page, yet you have ${rv}+ reviews — guests can't book you directly or find you cleanly on Google.`;
    hookTH=`"เว็บไซต์" ของคุณคือเพจ Facebook แต่มีรีวิวกว่า ${rv} รายการ ลูกค้าจึงจองตรงไม่ได้และหาบน Google ได้ยาก`; }
  else if(s==="ota"){ hookEN=`Your only "website" link is an OTA/booking page — you don't own your web presence, and every booking pays commission.`;
    hookTH=`ลิงก์ "เว็บไซต์" ของคุณคือหน้า OTA คุณไม่ได้เป็นเจ้าของเว็บเอง และทุกการจองเสียค่าคอม`; }
  else { hookEN=`You have a website, but it doesn't match the quality of the property — and guests still book through the OTAs instead of direct.`;
    hookTH=`คุณมีเว็บไซต์แล้ว แต่ยังไม่สะท้อนคุณภาพของที่พัก และลูกค้ายังจองผ่าน OTA แทนการจองตรง`; }
  if(spa){ hookEN=`${rv}+ reviews (⭐${rt}) but ${s==="none"?"no website":"a weak web presence"} — guests searching "${area} spa / massage" can't find or book you online.`;
    hookTH=`รีวิวกว่า ${rv} (⭐${rt}) แต่${s==="none"?"ยังไม่มีเว็บไซต์":"เว็บยังไม่แข็งแรง"} ลูกค้าที่ค้นหา "สปา ${area}" หาและจองออนไลน์ไม่ได้`; }

  const open = prem
    ? {en:`Hello 🙏 I'm [your name] — I build websites & manage Google for boutique hotels and resorts. ${nm} looks beautiful.`,
       th:`สวัสดีค่ะ 🙏 ดิฉัน [ชื่อ] รับทำเว็บไซต์และดูแล Google ให้โรงแรมบูทีคและรีสอร์ทค่ะ ${nm} สวยมากเลยค่ะ`}
    : {en:`Hi 🙏 I'm [your name] — I build websites & fix Google Maps for small hotels & businesses. ${nm} looks lovely.`,
       th:`สวัสดีค่ะ 🙏 ดิฉัน [ชื่อ] รับทำเว็บไซต์และปรับ Google Maps ให้ที่พักและร้านค้าเล็ก ๆ ค่ะ ${nm} น่ารักมากค่ะ`};
  const valueEN = prem
    ? `A site & Google presence that match the property would bring more high-value guests who book direct (and return) — protecting your margin and brand.`
    : `A simple direct-booking site + a stronger Google Maps would let guests book you directly and keep the commission you're giving away.`;
  const valueTH = prem
    ? `เว็บและ Google ที่เข้ากับระดับของที่พักจะช่วยดึงลูกค้าระดับพรีเมียมที่จองตรง (และกลับมาอีก) รักษากำไรและแบรนด์ของคุณค่ะ`
    : `เว็บจองตรงง่าย ๆ พร้อม Google Maps ที่แข็งแรง จะช่วยให้ลูกค้าจองตรงกับคุณ และเก็บค่าคอมที่เคยเสียไปไว้เองค่ะ`;
  const askEN=`If it's useful, I'd be glad to send a short, no-obligation video showing a few things we'd improve — okay to send? 🙂`;
  const askTH=`ถ้าสนใจ ดิฉันยินดีส่งวิดีโอสั้น ๆ ชี้จุดที่ปรับได้ให้ดู ไม่มีข้อผูกมัดค่ะ สะดวกไหมคะ? 🙂`;
  const msgEN=`${open.en} ${hookEN} ${valueEN} ${askEN}`;
  const msgTH=`${open.th} ${hookTH} ${valueTH} ${askTH}`;
  const pkg = spa ? "Essentials ฿3,900 or Hotel ฿7,900/mo · build ฿15–25k"
        : prem ? "Hotel ฿7,900 or Growth ฿10,800/mo · build ฿25–40k"
               : "Care+Maps ฿3,900–7,900/mo · build ฿15–25k";
  return {hookEN,hookTH,msgEN,msgTH,pkg,situation:s,spa,prem};
}

// ---------- render ----------
function dotColor(l){const t=(l.tier||"").toUpperCase();if(t.includes("HOT"))return"var(--hot)";if(t.includes("WARM"))return"var(--warm)";if(isPrem(l))return"var(--brand)";return"var(--cool)"}
function statusOf(l){return (saved[leadId(l)]||{}).status||"new"}
function filtered(){
  return LEADS.filter(l=>{
    if(Q&&!((l.name+" "+l.area).toLowerCase().includes(Q)))return false;
    if(FILT.phone&&!l.phone)return false;
    if(FILT.type==="spa"&&!isSpa(l))return false;
    if(FILT.type==="stay"&&isSpa(l))return false;
    if(FILT.tier==="prem"&&!isPrem(l))return false;
    if(FILT.tier==="hot"&&!(l.tier||"").toUpperCase().includes("HOT"))return false;
    if(FILT.site&&siteState(l)!==FILT.site)return false;
    if(FILT.status&&statusOf(l)!==FILT.status)return false;
    return true;
  });
}
const STATUSES=["new","contacted","replied","audit_sent","proposal","won","lost"];
function renderList(){
  const arr=filtered();
  document.getElementById("list").innerHTML=arr.map((l,idx)=>{
    const i=LEADS.indexOf(l), s=siteState(l);
    return `<div class="leadrow ${SEL===i?'sel':''}" onclick="sel(${i})">
      <div class="top"><div><div class="nm">${esc(l.name)}</div>
      <div class="meta">${l.rating?'⭐'+l.rating:''} ${l.reviews?l.reviews+' rev':''} ${l.phone?'📞':'· no phone'} </div>
      <div class="meta">${esc(l.area||'')}</div></div>
      <div class="dot" style="background:${dotColor(l)}"></div></div>
      <div class="pillrow"><span class="tag ${s}">${s==='none'?'no website':s}</span>${isPrem(l)?'<span class="tag prem">premium</span>':''}${isSpa(l)?'<span class="tag cool">spa</span>':''}<span class="tag ${statusOf(l)==='new'?'cool':'warm'}">${statusOf(l)}</span></div>
    </div>`;}).join("")||`<p style="color:#94a3b8;font-size:.85rem;padding:10px">No leads match.</p>`;
  document.getElementById("hstats").innerHTML=`<div><b>${LEADS.length}</b>leads</div><div><b>${LEADS.filter(l=>statusOf(l)!=='new').length}</b>worked</div><div><b>${LEADS.filter(l=>statusOf(l)==='won').length}</b>won</div>`;
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function chips(){
  const F=[["Has phone","phone",true],["Premium","tier","prem"],["🔥 Hot","tier","hot"],["Stay","type","stay"],["Spa","type","spa"],["No website","site","none"],["Facebook-only","site","social"]];
  document.getElementById("filters").innerHTML=F.map(([lbl,k,v])=>{
    const on=k==="phone"?FILT.phone:FILT[k]===v;
    return `<button class="chip ${on?'on':''}" onclick="tog('${k}','${v}')">${lbl}</button>`}).join("");
}
function tog(k,v){ if(k==="phone")FILT.phone=!FILT.phone; else FILT[k]=FILT[k]===v?"":v; chips();renderList(); }
function dash(){
  document.getElementById("empty").style.display="none";
  const d=document.getElementById("dash");d.style.display="block";
  const byS=Object.fromEntries(STATUSES.map(s=>[s,LEADS.filter(l=>statusOf(l)===s).length]));
  const today=new Date().toISOString().slice(0,10);
  const contactedToday=LEADS.filter(l=>(saved[leadId(l)]||{}).contactedDate===today).length;
  d.innerHTML=`<div class="dash">
    <div class="stat"><b>${LEADS.length}</b><span>total leads</span></div>
    <div class="stat"><b>${LEADS.filter(l=>isPrem(l)).length}</b><span>premium</span></div>
    <div class="stat"><b>${LEADS.filter(l=>siteState(l)==='none').length}</b><span>no website</span></div>
    <div class="stat"><b>${contactedToday}/6</b><span>contacted today 🎯</span></div></div>
    <div class="sech">Pipeline</div><div class="board">${STATUSES.map(s=>`<div class="pcol"><h5>${s}<span>${byS[s]}</span></h5>${LEADS.filter(l=>statusOf(l)===s).slice(0,6).map(l=>`<div class="ptask" onclick="sel(${LEADS.indexOf(l)})">${esc(l.name).slice(0,28)}</div>`).join("")}</div>`).join("")}</div>`;
}
function sel(i){SEL=i;renderList();renderDetail()}
function renderDetail(){
  const l=LEADS[SEL]; if(!l)return; const id=leadId(l); const rec=saved[id]||{checks:[]};
  const p=genPitch(l); const lang=LANG[id]||"en";
  const d=document.getElementById("detail");
  const wlink=l.website?`<a class="q btn btn-o" href="${esc(l.website)}" target="_blank">🌐 Site</a>`:"";
  const checks=["Read their latest Google reviews (what guests praise / complain)","Note their room types & price level","Check if they're on Agoda/Booking (OTA dependence)","Find the owner/manager name if possible","Glance at their Facebook for photos + activity","Pick the ONE specific thing to mention first"];
  d.innerHTML=`
   <div class="dhead"><h2>${esc(l.name)}</h2>
     <div class="dmeta">${l.category?esc(l.category):''} ${l.rating?'· ⭐'+l.rating:''} ${l.reviews?'· '+l.reviews+' reviews':''} ${l.photos?'· '+l.photos+' photos':''} ${l.price?'· '+esc(l.price):''}</div>
     <div class="badges"><span class="tag ${p.situation}">${p.situation==='none'?'no website':p.situation}</span>${p.prem?'<span class="tag prem">premium</span>':''}${p.spa?'<span class="tag cool">spa</span>':'<span class="tag cool">stay</span>'}</div>
   </div>
   <div class="quick">
     ${l.maps?`<a class="q btn btn-o" href="${esc(l.maps)}" target="_blank">📍 Maps</a>`:""}
     ${l.phone?`<a class="q btn btn-t" href="tel:${esc(l.phone).replace(/\s/g,'')}">📞 ${esc(l.phone)}</a>`:""}
     ${wlink}
   </div>
   <div class="panel"><h4>Status</h4>
     <select onchange="setStatus('${id}',this.value)">${STATUSES.map(s=>`<option ${statusOf(l)===s?'selected':''}>${s}</option>`).join("")}</select>
   </div>
   <div class="panel"><h4>Tailored pitch
     <span class="seg"><button class="${lang==='en'?'on':''}" onclick="setLang('${id}','en')">EN</button><button class="${lang==='th'?'on':''}" onclick="setLang('${id}','th')">ไทย</button></span></h4>
     <div class="hook">💡 Lead with: ${lang==='en'?esc(p.hookEN):esc(p.hookTH)}</div>
     <div class="pitch" id="pitchtext">${lang==='en'?esc(p.msgEN):esc(p.msgTH)}</div>
     <div class="pillrow"><button class="copybtn" onclick="copyPitch()">📋 Copy message</button><span class="tag prem">${esc(p.pkg)}</span></div>
   </div>
   <div class="panel"><h4>Research before you message</h4>
     ${checks.map((c,j)=>`<label class="check"><input type="checkbox" ${(rec.checks||[]).includes(j)?'checked':''} onchange="toggleCheck('${id}',${j})"> ${c}</label>`).join("")}
     <div style="font-size:.78rem;color:var(--muted);margin:8px 0 6px">Ask Claude (paste into your terminal):</div>
     <div class="askbox">"Research ${esc(l.name)} in ${esc(l.area||'')} — pull recent Google reviews & summarise what guests love and complain about, and draft a personalised opening line."</div>
   </div>
   <div class="panel"><h4>Notes</h4>
     <textarea placeholder="Owner name, what they said, follow-up date…" onchange="setNotes('${id}',this.value)">${esc(rec.notes||"")}</textarea>
   </div>`;
}
function setStatus(id,v){saved[id]=saved[id]||{};saved[id].status=v;if(v==="contacted"&&!saved[id].contactedDate)saved[id].contactedDate=new Date().toISOString().slice(0,10);persist();renderList();dash()}
function setNotes(id,v){saved[id]=saved[id]||{};saved[id].notes=v;persist()}
function toggleCheck(id,j){saved[id]=saved[id]||{};const c=new Set(saved[id].checks||[]);c.has(j)?c.delete(j):c.add(j);saved[id].checks=[...c];persist()}
function setLang(id,l){LANG[id]=l;renderDetail()}
function copyPitch(){const t=document.getElementById("pitchtext").innerText;navigator.clipboard.writeText(t).then(()=>{event.target.textContent="✓ Copied"});}
function persist(){localStorage.setItem(STORE,JSON.stringify(saved))}

// ---------- import/export ----------
function load(text){ LEADS=parseCSV(text).map(norm).filter(l=>l.name);
  // sort: premium+hot first, then reviews
  LEADS.sort((a,b)=>( (isPrem(b)?1:0)-(isPrem(a)?1:0) ) || (b.reviews-a.reviews));
  chips();renderList();dash();SEL=null;document.getElementById("detail").innerHTML='<div class="empty"><p>Select a lead to see its tailored pitch.</p></div>';
}
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f)};
document.getElementById("search").oninput=e=>{Q=e.target.value.toLowerCase();renderList()};
document.getElementById("export").onclick=()=>{
  if(!LEADS.length)return;
  const cols=["name","phone","website","category","area","rating","reviews","status","notes","maps_url"];
  const rows=[cols.join(",")].concat(LEADS.map(l=>{const r=saved[leadId(l)]||{};return cols.map(c=>{
    let v=c==="status"?(r.status||"new"):c==="notes"?(r.notes||""):c==="maps_url"?l.maps:l[c]||"";
    return '"'+String(v).replace(/"/g,'""')+'"'}).join(",")}));
  const b=new Blob([rows.join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="leads-export.csv";a.click();
};
// drag & drop
const drop=document.getElementById("drop");
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop&&drop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop&&drop.classList.remove("over")}));
document.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f){const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f)}});
</script>
</body>
</html>
