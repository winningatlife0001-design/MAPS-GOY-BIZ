name: Deploy site to GitHub Pages

# Publishes the /site folder (her agency website + live demos) to GitHub Pages.
# ONE-TIME setup by the repo owner: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, every push to this branch deploys,
# and the site goes live at: https://winningatlife0001-design.github.io/maps-goy-biz/

on:
  push:
    branches: [ "claude/bold-franklin-ImYNK" ]
    paths: [ "site/**", ".github/workflows/deploy-pages.yml" ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
